name: Release

# Push a tag like v0.1.0 to publish a downloadable release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      CERT_P12_BASE64: ${{ secrets.MACMIXER_SIGNING_CERT_P12 }}
      CERT_PASSWORD: ${{ secrets.MACMIXER_SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Ad-hoc signing (the default) gives every build a different identity, so
      # macOS forgets permissions users already granted (System Audio Recording,
      # Accessibility) on every single update. Signing with a stable self-signed
      # certificate instead keeps that identity constant across releases, so
      # those permissions survive an update. It does NOT replace a real Apple
      # Developer ID: Gatekeeper still shows the "unidentified developer" /
      # "Open Anyway" step either way — see scripts/build-app.sh and the README.
      - name: Import signing certificate
        if: ${{ env.CERT_P12_BASE64 != '' }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/macmixer-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/"//g')
          security list-keychain -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=MacMixer Self-Signed" >> "$GITHUB_ENV"

      - name: Build universal app
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ARCHS="arm64 x86_64" ./scripts/build-app.sh

      - name: Package
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="build/MacMixer-${VERSION}.zip"
          ditto -c -k --keepParent build/MacMixer.app "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.pkg.outputs.zip }}" "${{ steps.pkg.outputs.zip }}.sha256" \
            --title "MacMixer $GITHUB_REF_NAME" \
            --generate-notes
